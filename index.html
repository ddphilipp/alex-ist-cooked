<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Phlight</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<style>
:root{--bg:rgba(8,16,28,.72);--fg:#e9f1ff;--ac:#4fc3ff;--sa:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--fg);font:14px system-ui,sans-serif}
#gl{touch-action:none;position:fixed;inset:0;width:100%;height:100%;display:block}

#load.hide{opacity:0;pointer-events:none}#load h1{font-size:12vw;letter-spacing:.3em;margin:0;font-weight:200}
.bar{width:60%;max-width:360px;height:6px;background:#ffffff22;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#top{position:fixed;top:calc(var(--sa) + 6px);left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:14px;background:var(--bg);padding:8px 14px;border-radius:14px;white-space:nowrap;font-size:13px}
#top b{font-size:16px;color:var(--ac);font-variant-numeric:tabular-nums}
@media(max-width:480px){#top{gap:8px;padding:6px 8px;font-size:11px}#top b{font-size:13px}}
#mapw{position:fixed;left:8px;top:calc(var(--sa) + 62px);z-index:5}
#mapw button{height:36px;font-size:13px;padding:0 10px;display:block}
#map{border-radius:12px;border:2px solid #ffffff55;margin-top:4px;width:150px;height:150px}
#map.big{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,70vh);height:min(92vw,70vh);z-index:-1;margin:0}
#side{position:fixed;right:8px;top:calc(var(--sa) + 62px);z-index:5;display:flex;flex-direction:column;gap:8px}
#fireb{font-size:15px}#routeinfo{pointer-events:none;background:var(--bg);padding:7px 10px;border-radius:10px;font-size:12px;width:150px;margin-top:4px;line-height:1.35}#routeend{font-size:12px;margin-top:4px}#routeend[hidden]{display:none}#map.big~#routeinfo{display:none}
#ctl{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-end;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 10px);pointer-events:none}
#ctl>*{pointer-events:auto}.col{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);padding:8px;border-radius:14px;font-size:11px}
.v{writing-mode:vertical-lr;direction:rtl;width:36px;height:min(28vh,170px);accent-color:var(--ac)}
.mid{display:flex;gap:10px}.mid button{width:64px;height:60px}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);z-index:9;background:var(--bg);padding:12px 18px;border-radius:14px;opacity:0;transition:opacity .4s;text-align:center;max-width:86%;pointer-events:none}
#tpb{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 148px);transform:translateX(-50%);z-index:6;padding:0 18px;font-size:16px;height:46px;white-space:nowrap}#tpb[hidden]{display:none}#reloadb{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);z-index:7;font-size:15px;padding:0 18px;white-space:nowrap}#reloadb[hidden]{display:none}#flash{position:fixed;inset:0;z-index:8;background:radial-gradient(#fff,#ff9a2a 60%,#c22);opacity:0;pointer-events:none}
#shop{position:fixed;inset:0;z-index:20;background:#050b14ee;overflow:auto;padding:calc(var(--sa) + 12px) 12px 20px}
#shop[hidden]{display:none}#plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.pc{background:#12263d;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}.pc button{font-size:15px;height:42px}
.st{font-size:12px}.st i{display:block;height:6px;background:#ffffff22;border-radius:3px}.st u{display:block;height:100%;background:var(--ac);border-radius:3px}
#emg{position:fixed;left:50%;top:calc(var(--sa) + 56px);transform:translateX(-50%);z-index:12;width:min(60vw,360px);background:rgba(40,8,8,.9);border:2px solid #ff5a4f;border-radius:14px;padding:10px;font-size:13px;animation:bl 1s infinite}
#emg[hidden]{display:none}@keyframes bl{50%{border-color:#fff}}#emh{font-weight:700;color:#ff8a80;font-size:14px;margin-bottom:4px}
#ems button{display:block;width:100%;height:auto;min-height:40px;font-size:13px;text-align:left;margin-top:5px;padding:6px 10px}#ems button:disabled{opacity:.35}#ems button.ok{background:#1d4d2b;opacity:.8}

</style></head><body>

<div id="side"><button id="camb" aria-label="Kamera">👁</button><button id="shopb" aria-label="Shop">🛒</button><button id="gearb" aria-label="Fahrwerk">🛞</button><button id="fireb" aria-label="Rakete abfeuern">🚀 <span id="ammo">5</span></button><button id="reloadb" hidden>🔄 Raketen aufladen</button></div>

<div id="ctl">
<div class="col"><span>SCHUB</span><input id="thr" class="v" type="range" min="0" max="100" value="0"></div>
<div class="mid"><button id="bl">◀</button><button id="lv" style="font-size:13px">Gerade</button><button id="br">▶</button></div>
<div class="col"><span>NEIGUNG</span><input id="pit" class="v" type="range" min="-25" max="25" step=".1" value="0"></div>
</div>
<div id="emg" hidden><div id="emh"></div><div id="emd"></div><div id="ems"></div></div><div id="toast"></div><button id="tpb" hidden>🏢 Zurück zum Terminal</button><div id="flash"></div>
<div id="shop" hidden><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">✈ Hangar-Shop · $ <span id="shM"></span></h2><button id="shx">✕</button></div><div id="plist"></div></div>

 const add=(geo,m,x,y,z,f)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);g.add(o);f&&f(o);return o};
 const cyl=(a,b,l)=>new THREE.CylinderGeometry(a,b,l,20).rotateX(Math.PI/2);
 add(cyl(r,r,L*.55),B,0,y0,0);add(cyl(r*.2,r,L*.18),B,0,y0,L*.365);add(cyl(r,r*.22,L*.27),B,0,y0+r*.15,-L*.41);
 const wing=(sp,root,tip,sw,y,z,m)=>{const sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(sp,-sw);sh.lineTo(sp,-sw-tip);sh.lineTo(0,-root);

 if(s.k=='jet'||s.k=='a380'){wing(hs,L*.2,L*.05,L*.18,y0-r*.45,L*.12,B);wing(s.W*.18,L*.1,L*.04,L*.07,y0+r*.1,-L*.36,B);

 else{wing(hs,L*.42,L*.07,L*.3,y0-r*.2,-L*.05,B);wing(s.W*.28,L*.16,L*.05,L*.1,y0,-L*.28,B);
  add(new THREE.SphereGeometry(r*.8,12,8),G,0,y0+r*.55,L*.2,o=>o.scale.set(.8,.8,2.2));add(cyl(r*.8,r*.6,L*.12),M(0x333a42),0,y0,-L*.5);
   const flame=new THREE.Mesh(new THREE.ConeGeometry(r*.55,L*.2,12),new THREE.MeshBasicMaterial({color:0xff7b20,transparent:true,opacity:.88}));

function rocketExplosion(pos){const g=new THREE.Group();g.position.set(pos.x,Math.max(.8,pos.y+.8),pos.z);const mats=[0xff3b12,0xffa51f,0xfff0a0].map(color=>new THREE.MeshBasicMaterial({color,transparent:true,opacity:1,depthWrite:false,fog:false}));const balls=[1.2,1.8,2.4].map((r,i)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mats[i]);g.add(m);return m});scene.add(g);const started=performance.now();const tick=()=>{if(!g.parent)return;const t=(performance.now()-started)/1000;balls.forEach((b,i)=>{b.scale.setScalar(1+t*(i===0?11:i===1?8:6));mats[i].opacity=Math.max(0,1-t/(i===0?.55:i===1?.8:1.05))});if(t>1.1){scene.remove(g);g.traverse(o=>{if(o.geometry)o.geometry.dispose()});mats.forEach(m=>m.dispose())}else requestAnimationFrame(tick)};requestAnimationFrame(tick);toast('💥 Rakete ist am Einschlag explodiert!',2600)}
function fireRocket(){

const EF={out:0,drift:0,fire:0,pitot:0,fake:0,gj:0},PAX=['a320','b737','b777','b747','a380','pjet'];let EM=null,emT=rnd(90,180),emWasAir=false,emFx=null,emBp=0,AC;
if(SV.emerg===undefined)SV.emerg=true;

function emBeep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=880;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.12)}catch(e){}}
function emTgt(v,st){if(!EF.out)return v;if(S.en==1)return P.air?st*1.25:0;return v*(S.en-EF.out)/S.en}
function emSink(){return EF.out&&S.en==1&&P.air?P.spd/(S.k=='prop'?9:12):0}
function emFire(on){if(emFx){emFx.parent&&emFx.parent.remove(emFx);emFx=null}if(!on||!plane||!EM)return;const L=S.L,r=L*.078,hs=S.W/2,x=S.en==1?0:(S.en==4?hs*.56:hs*.34)*EM.side,mk=c=>new THREE.Sprite(new THREE.SpriteMaterial({map:puff,color:c,transparent:true,depthWrite:false,fog:false}));emFx=new THREE.Group();emFx.add(mk(0xff6a10),mk(0x222222));emFx.position.set(x,r+2.2-r*.9,L*.05);plane.add(emFx)}
function emClear(){EM=null;Object.assign(EF,{out:0,drift:0,fire:0,pitot:0,fake:0,gj:0});emFire(false);emWasAir=false;emT=rnd(90,180);if($('emg'))$('emg').hidden=true}
function emDone(m,rew){SV.money+=rew;save();toast('✅ '+m+(rew?' +$'+Math.round(rew):''),5000);emClear();emT=rnd(120,240)}
function emFail(m){SV.money=Math.max(0,SV.money-500);save();toast('❌ '+m+' (−$500)',6000);emClear()}
function emRender(){const p=$('emg');if(!EM){p.hidden=true;return}const E=EM;p.hidden=false;$('emh').textContent='⚠ '+E.title;$('emd').innerHTML=E.info+(E.lim>0?' · <b id="emt"></b>':'');
 $('ems').innerHTML=E.steps.map((s,k)=>`<button data-k="${k}" ${k!=E.i||E.busy?'disabled':''} class="${k<E.i?'ok':''}">${k<E.i?'✔ ':(k==E.i&&E.busy?'⏳ ':'')}${s.t}</button>`).join('')+(E.land?`<div style="margin-top:6px">🛬 Nächster Flughafen: <b>${ISL[nearIsl()].n}</b> – sicher landen!</div>`:'')}

function emStart(id){const en=S.en,side=Math.random()<.5?1:-1,E=EM={id,side,t:0,i:0,land:false,busy:null,lim:0,steps:[],rew:0,title:'',info:'',onLim:null},eng=en>1?(side>0?'rechts':'links'):'',
 idle={t:'Schubhebel auf Leerlauf',f:()=>{thr.value=0}},shut={t:'Triebwerk abstellen (Treibstoff aus)',f:()=>{EF.drift=0}};
 if(id==='eng'){const bird=P.y<900;EF.out=1;EF.drift=en>1?side*.05:0;E.rew=3000;E.title=bird?'VOGELSCHLAG – Triebwerk '+eng+' ausgefallen':'TRIEBWERKSAUSFALL (Flame-out) '+eng;
  E.info=en>1?'Das Flugzeug zieht zur Seite – gegenlenken! Schub reduziert.':'Gleitflug! Nase etwas senken, Geschwindigkeit halten, Landeplatz suchen.';

 else if(id==='fire'){EF.out=1;EF.fire=1;EF.drift=en>1?side*.05:0;E.rew=5000;E.lim=50;E.onLim=()=>crash('Triebwerksbrand außer Kontrolle');E.title='TRIEBWERKSBRAND '+eng;E.info='Feuer breitet sich aus! Checkliste schnell abarbeiten.';emFire(true);
  const ext=()=>{EF.fire=0;E.lim=0;emFire(false);toast('🧯 Feuer gelöscht')},b2={t:'Löschflasche 2 auslösen',f:ext};
  E.steps=[idle,{...shut,t:'Triebwerk abstellen + Brandhahn ziehen'},{t:'Löschflasche 1 auslösen',f:()=>{if(Math.random()<.7)ext();else{toast('🔥 Feuer brennt weiter!');E.steps.push(b2)}}}]}
 else if(id==='gear'){EF.gj=1;E.rew=1500;E.title='FAHRWERK KLEMMT';E.info='Fahrwerk lässt sich nicht normal ausfahren (Hydraulikfehler).';
  E.steps=[{t:'Hydraulikdruck & Sicherungen prüfen',f:()=>{}},{t:'Notausfahrung (Schwerkraft) auslösen – 10 s',d:10,f:()=>{EF.gj=0;gear=1;$('gearb').style.opacity=1;emDone('Fahrwerk ausgefahren und verriegelt',1500)}}]}
 else if(id==='pitot'){EF.pitot=1;E.rew=1000;E.title='GESCHWINDIGKEITSANZEIGE UNZUVERLÄSSIG';E.info='Pitot-Rohre vereist! Anzeige falsch – nach Gefühl fliegen: Neigung ca. +5°, Schub konstant.';
  E.steps=[{t:'Neigung ~5° und Schub konstant halten',f:()=>{}},{t:'Pitot-Heizung einschalten – Eis schmilzt (15 s)',d:15,f:()=>{EF.pitot=0;emDone('Geschwindigkeitsanzeige wieder zuverlässig',1000)}}]}

  E.steps=[{t:'PAN-PAN-Funkspruch absetzen, Umleitung beantragen',f:()=>{selectedIsland=nearIsl();toast('📻 Umleitung: '+ISL[selectedIsland].n,4000)}}]}
 toast('⚠ '+E.title,5000);emBp=0;emRender()}
function emPick(){const y=P.y,o=[['eng',y>100?(y<900?5:3):0],['fire',y>300?1.5:0],['gear',!gear&&y>250?3:0],['pitot',y>800?2:0],['med',PAX.includes(S.id)&&y>800?2:0]],tot=o.reduce((a,b)=>a+b[1],0);if(!tot){emT=20;return}let r=Math.random()*tot,id=o[0][0];for(const[k,w]of o){if(w&&(r-=w)<=0){id=k;break}}emStart(id)}
function emTick(dt){
 if(!EM){if(SV.emerg&&P.air&&!stuck){emT-=dt;if(emT<=0)emPick()}return}
 const E=EM;E.t+=dt;
 if(E.busy){E.busy.t-=dt;if(E.busy.t<=0){const b=E.busy;E.busy=null;b.f();emAdv();if(!EM)return}}
 if(EF.drift&&P.air)P.h+=EF.drift*dt;
 if(EF.pitot&&fc%15==0)EF.fake=Math.round(P.spd*3.6*rnd(.3,1.6));
 if(E.lim>0){E.lim-=dt;const t=$('emt');if(t)t.textContent='⏱ '+Math.max(0,Math.ceil(E.lim))+' s';if(E.lim<=0){E.lim=0;E.onLim&&E.onLim();return}}
 if(emFx){const[f,k]=emFx.children,s=Math.max(S.L*.1,1.5);f.scale.setScalar(s*rnd(.8,1.3));k.scale.setScalar(s*rnd(2,3));k.position.z=-S.L*.15;k.material.opacity=.6}
 if(E.i<E.steps.length||EF.fire){emBp-=dt;if(emBp<=0){emBp=1.6;emBeep()}}
 if(E.land){if(P.air)emWasAir=true;else if(emWasAir&&!boom){if(!stuck)emDone('Sichere Landung – Notfall gelöst!',E.rew);else if(stuck==1)emDone('Notlandung abseits der Piste – alle haben überlebt',E.rew*.5);else emFail('Wasserlandung – Notfall nicht sauber gelöst')}}
}

let last=performance.now(),mt=0;
